[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pemtfln"
version = "0.1.0"
description = "Physics-encoded deep learning for nonlinear vehicle platoon dynamics modeling."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Hao Lyu" }
]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "torch>=2.0",
  "tqdm>=4.64"
]

[tool.setuptools.packages.find]
include = ["pemtfln*"]
